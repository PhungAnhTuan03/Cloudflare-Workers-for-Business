# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  better-sqlite3: false
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt),
# no trust downgrades, and no non-registry transitive sources.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true
trustPolicy: no-downgrade
